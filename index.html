  <script>
    "use strict";
    // トップページ: 直近の練習予定を読み込んで表示（最大3件）
    document.addEventListener("DOMContentLoaded", async () => {
      const container = document.getElementById("upcoming-schedules");
      if (!container) return;

      const data = await loadJSON("data/schedules.json");
      if (!data) {
        container.innerHTML = '<p class="text-secondary">データの読み込みに失敗しました。</p>';
        return;
      }

      // 未来の日程のみ抽出し、日付昇順でソート、最大3件
      const today = new Date();
      today.setHours(0,0,0,0);
      const upcoming = data.schedules
        .filter(s => new Date(s.date + "T00:00:00") >= today)
        .sort((a, b) => new Date(a.date) - new Date(b.date))
        .slice(0, 3);

      if (upcoming.length === 0) {
        container.innerHTML = '<p class="text-secondary">直近の練習予定はありません。</p>';
        return;
      }

      container.innerHTML = upcoming.map(s => `
        <article class="card upcoming-card">
          <div class="date-display">${formatDate(s.date, s.dayOfWeek)}</div>
          <div class="time-location">
            <span>🕐 ${s.startTime}〜${s.endTime}</span>
            <span>📍 ${s.location}</span>
          </div>
        </article>
      `).join("");
    });
  </script>
